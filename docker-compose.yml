# OpenPencil browser app + MinIO cloud storage behind ci-nginx-proxy on shared-web.
#
#   docker compose up -d --build
#
# Domains:
#   https://pencil.rpine.xyz/      — SPA (VIRTUAL_HOST / Let's Encrypt)
#   https://pencil.rpine.xyz/mqtt  — MQTT-over-WebSocket signaling (collab-mqtt)
#   https://pencil-s3.rpine.xyz/   — MinIO S3 API (path-style)

name: open-pencil

services:
  cursor-bridge:
    build:
      context: ./services/cursor-bridge
      dockerfile: Dockerfile
    image: open-pencil-cursor-bridge:local
    container_name: open_pencil_cursor
    environment:
      PORT: "8787"
    expose:
      - "8787"
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/cursor/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  collab-mqtt:
    image: eclipse-mosquitto:2
    container_name: open_pencil_mqtt
    volumes:
      - ./services/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    expose:
      - "9001"
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_pub",
          "-h",
          "127.0.0.1",
          "-p",
          "1883",
          "-t",
          "health",
          "-m",
          "ok",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nginx-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open_pencil_nginx
    depends_on:
      cursor-bridge:
        condition: service_healthy
      collab-mqtt:
        condition: service_healthy
    env_file:
      - ./.envs/.env.web
    environment:
      VIRTUAL_PORT: "80"
    expose:
      - "80"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    image: open-pencil-minio:local
    container_name: open_pencil_minio
    command: server /data --address ":9000" --console-address ":9001"
    env_file:
      - ./.envs/.env.minio
    environment:
      VIRTUAL_PORT: "9000"
    volumes:
      - ./s3-data:/data
    expose:
      - "9000"
      - "9001"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  default:
    external: true
    name: shared-web
