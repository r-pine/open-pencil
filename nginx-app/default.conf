server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set_real_ip_from 192.167.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Edge (ci-nginx-proxy) health probe target.
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same-origin MQTT signaling (Trystero). WebSocket upgrade must reach Mosquitto.
    location ^~ /mqtt {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mqtt_upstream collab-mqtt:9001;
        proxy_pass http://$mqtt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        # CONNECT is ~30 bytes and CONNACK is 4. Default request buffering holds that
        # first frame until the client gives up, so Mosquitto never sees CONNECT and
        # its pre-CONNECT keepalive (20s * 1.5) logs "exceeded timeout".
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        gzip off;
        proxy_socket_keepalive on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Same-origin Cursor bridge. SSE must not be buffered.
    location ^~ /api/cursor/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cursor_upstream cursor-bridge:8787;
        proxy_pass http://$cursor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # CanvasKit WASM must not be sniffed as octet-stream.
    location = /canvaskit.wasm {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2|png|jpg|jpeg|gif|ico|svg|webp|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback (same contract as public/_redirects).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
