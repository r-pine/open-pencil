# Signaling only. WebRTC media does not pass through this broker.
# Browsers connect to wss://pencil.rpine.xyz/mqtt. Mosquitto 2.1 accepts that path on the websocket listener.

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous true

# Loopback MQTT for the container healthcheck. Not published on the docker network.
listener 1883 127.0.0.1
protocol mqtt

listener 9001
protocol websockets
# Browser tabs on the site send this Origin. Other sites cannot use the broker.
websockets_origin https://pencil.rpine.xyz

# SDP signaling is a few kilobytes. Keep the broker from storing or relaying documents.
max_packet_size 262144
max_connections 400
max_inflight_messages 20
max_queued_messages 100
